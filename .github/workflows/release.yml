name: Build & release

# Every push to main builds all Linux packages. If the version in
# package.json (shown as MAJOR.MINOR, e.g. 1.0) has no GitHub release yet,
# one release "v<version>" is created holding every package.
#
# Manual run ("Run workflow" in the Actions tab) with `from_run` set
# republishes packages that an earlier run already built, without rebuilding:
# e.g. version 1.1, sha da68932…, from_run 42086950592.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      from_run:
        description: "Republish: ID of the run whose packages to publish (leave empty to build)"
        required: false
      version:
        description: "Republish: version those packages are (e.g. 1.1)"
        required: false
      sha:
        description: "Republish: commit to tag (full SHA)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.from_run == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node scripts/version.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$V is already released; packages will be built but not published."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools flatpak flatpak-builder

      - run: npm ci
      - run: npm test

      - name: Build AppImage, rpm, deb, pacman, tar.gz
        run: npm run dist

      - name: Import Flatpak signing key (optional)
        id: gpg
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "No FLATPAK_GPG_PRIVATE_KEY secret: the Flatpak repository will be unsigned."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 -p "$GNUPGHOME"
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          gpg --export "$KEY" > "$RUNNER_TEMP/flatpak-pubkey.gpg"
          echo "args=--gpg-sign=$KEY --gpg-homedir=$GNUPGHOME" >> "$GITHUB_OUTPUT"
          echo "pubkey=$RUNNER_TEMP/flatpak-pubkey.gpg" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak bundle + repository
        id: flatpak
        continue-on-error: true
        env:
          V: ${{ steps.ver.outputs.version }}
          GPG_ARGS: ${{ steps.gpg.outputs.args }}
          PUBKEY: ${{ steps.gpg.outputs.pubkey }}
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo/
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cd flatpak
          flatpak-builder --user --install-deps-from=flathub --force-clean $GPG_ARGS \
            --default-branch=stable --repo=repo build-dir io.github.samschultzponsys.PwaPop.yml
          flatpak build-update-repo $GPG_ARGS --title="PWA Pop" --default-branch=stable --prune repo
          BUNDLE_KEYS=""; [ -n "$PUBKEY" ] && BUNDLE_KEYS="--gpg-keys=$PUBKEY"
          # --repo-url makes bundle installs track the repository, so Discover /
          # flatpak update pick up new versions.
          flatpak build-bundle $GPG_ARGS $BUNDLE_KEYS --repo-url="$REPO_URL" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "../release/pwa-pop-$V-x86_64.flatpak" io.github.samschultzponsys.PwaPop stable

          # GitHub Pages site: the OSTree repository + .flatpakrepo/.flatpakref files.
          SITE=../site; mkdir -p $SITE
          cp -a repo $SITE/repo
          rm -rf $SITE/repo/tmp $SITE/repo/.lock
          cp ../assets/icons/128x128.png $SITE/icon.png
          GPGLINE=""; [ -n "$PUBKEY" ] && GPGLINE="GPGKey=$(base64 -w0 "$PUBKEY")"
          printf '[Flatpak Repo]\nTitle=PWA Pop\nUrl=%s\nHomepage=https://github.com/%s\nComment=Web apps that live in your tray\nIcon=%sicon.png\nDefaultBranch=stable\n%s\n' \
            "$REPO_URL" "${{ github.repository }}" "${REPO_URL%repo/}" "$GPGLINE" > $SITE/pwa-pop.flatpakrepo
          printf '[Flatpak Ref]\nTitle=PWA Pop\nName=io.github.samschultzponsys.PwaPop\nBranch=stable\nUrl=%s\nSuggestRemoteName=pwa-pop\nHomepage=https://github.com/%s\nIcon=%sicon.png\nRuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo\nIsRuntime=false\n%s\n' \
            "$REPO_URL" "${{ github.repository }}" "${REPO_URL%repo/}" "$GPGLINE" > $SITE/pwa-pop.flatpakref
          sed "s|@VERSION@|$V|g" site-index.html > $SITE/index.html
          touch $SITE/.nojekyll
          echo "site=true" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          cd release
          sha256sum pwa-pop-${{ steps.ver.outputs.version }}-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Flatpak repository for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false' && steps.flatpak.outputs.site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-pop-${{ steps.ver.outputs.version }}
          path: |
            release/pwa-pop-*
            release/SHA256SUMS.txt
          if-no-files-found: error

    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false' }}
      publish_pages: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false' && steps.flatpak.outputs.site == 'true' }}

  # Tags the commit and publishes one GitHub release with every package.
  release:
    needs: build
    if: always() && (needs.build.outputs.release == 'true' || inputs.from_run != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ inputs.from_run != '' && inputs.version || needs.build.outputs.version }}
      SHA: ${{ inputs.from_run != '' && inputs.sha || github.sha }}
      RUN: ${{ inputs.from_run != '' && inputs.from_run || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: pwa-pop-${{ env.V }}
          path: dist
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: Check packages
        run: |
          ls -la dist
          test -f dist/SHA256SUMS.txt
          ls dist/pwa-pop-$V-* >/dev/null

      - name: Release notes from CHANGELOG.md
        run: |
          git show "$SHA:CHANGELOG.md" > changelog-at-sha.md
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' changelog-at-sha.md > release-notes.md
          {
            echo
            echo "### Downloads"
            echo "| Distro | File |"
            echo "|---|---|"
            echo "| Fedora / RHEL / openSUSE | \`pwa-pop-$V-x86_64.rpm\` |"
            echo "| Debian / Ubuntu / Mint | \`pwa-pop-$V-amd64.deb\` |"
            echo "| Arch / Manjaro | \`pwa-pop-$V-x64.pacman\` |"
            echo "| Any distro (portable) | \`pwa-pop-$V-x86_64.AppImage\` |"
            echo "| Any distro (sandboxed) | \`pwa-pop-$V-x86_64.flatpak\`, or with auto-updates: \`flatpak install --user https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pwa-pop.flatpakref\` |"
            echo "| Manual install | \`pwa-pop-$V-x64.tar.gz\` |"
          } >> release-notes.md
          cat release-notes.md

      - name: Tag v${{ env.V }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V already exists: $(git ls-remote --tags origin "refs/tags/v$V")"
          else
            git tag "v$V" "$SHA"
            git push origin "refs/tags/v$V"
          fi

      - name: Publish release
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V exists; uploading any missing files."
            gh release upload "v$V" dist/* --clobber
          else
            gh release create "v$V" dist/* --verify-tag --title "PWA Pop $V" --notes-file release-notes.md
          fi
          gh release view "v$V"

  # Publishes the Flatpak repository to https://<owner>.github.io/pwa-pop/.
  # One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
  pages:
    needs: [build, release]
    if: needs.build.outputs.publish_pages == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
