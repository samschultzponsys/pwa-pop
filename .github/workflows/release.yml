name: Build & release

# Every push to main builds all Linux packages. If the version in
# package.json (shown as MAJOR.MINOR, e.g. 1.0) has no GitHub release yet,
# one release "v<version>" is created holding every package.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out version
        id: ver
        run: |
          V=$(node scripts/version.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$V is already released; packages will be built but not published."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools flatpak flatpak-builder

      - run: npm ci
      - run: npm test

      - name: Build AppImage, rpm, deb, pacman, tar.gz
        run: npm run dist

      - name: Build Flatpak bundle
        continue-on-error: true
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cd flatpak
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir io.github.samschultzponsys.PwaPop.yml
          flatpak build-bundle repo "../release/pwa-pop-${{ steps.ver.outputs.version }}-x86_64.flatpak" io.github.samschultzponsys.PwaPop \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Checksums
        run: |
          cd release
          sha256sum pwa-pop-${{ steps.ver.outputs.version }}-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          V=${{ steps.ver.outputs.version }}
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "### Downloads"
            echo "| Distro | File |"
            echo "|---|---|"
            echo "| Fedora / RHEL / openSUSE | \`pwa-pop-$V-x86_64.rpm\` |"
            echo "| Debian / Ubuntu / Mint | \`pwa-pop-$V-amd64.deb\` |"
            echo "| Arch / Manjaro | \`pwa-pop-$V-x64.pacman\` |"
            echo "| Any distro (portable) | \`pwa-pop-$V-x86_64.AppImage\` |"
            echo "| Any distro (sandboxed) | \`pwa-pop-$V-x86_64.flatpak\` |"
            echo "| Manual install | \`pwa-pop-$V-x64.tar.gz\` |"
          } >> release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-pop-${{ steps.ver.outputs.version }}
          path: |
            release/pwa-pop-*
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PWA Pop ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: |
            release/pwa-pop-${{ steps.ver.outputs.version }}-*
            release/SHA256SUMS.txt
