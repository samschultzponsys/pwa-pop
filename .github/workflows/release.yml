name: Build & release

# Builds all Linux packages only when the version in package.json (shown as
# MAJOR.MINOR, e.g. 1.0) has no GitHub release yet, then creates one release
# "v<version>" holding every package. Other pushes run nothing.
#
# Manual run ("Run workflow" in the Actions tab) with `from_run` set
# republishes packages that an earlier run already built, without rebuilding:
# e.g. version 1.1, sha da68932…, from_run 42086950592.
on:
  # Only a version bump (package.json) can start a build; other pushes don't
  # run anything. The check job below also skips versions already released.
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      from_run:
        description: "Republish: ID of the run whose packages to publish (leave empty to build)"
        required: false
      version:
        description: "Republish: version those packages are (e.g. 1.1)"
        required: false
      sha:
        description: "Republish: commit to tag (full SHA)"
        required: false

permissions:
  contents: write
  pages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap check first: a push whose version is already released does not
  # rebuild every package (that only burns Actions minutes and storage).
  check:
    if: inputs.from_run == ''
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.ver.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node scripts/version.js)
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$V is already released; skipping the package build."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: inputs.from_run == '' && needs.check.outputs.released == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node scripts/version.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$V is already released; packages will be built but not published."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        # Ubuntu's mirrors occasionally fail or hang on GitHub's runners: retry
        # with short timeouts instead of hanging the whole release.
        timeout-minutes: 12
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends rpm libarchive-tools flatpak flatpak-builder elfutils; then
              exit 0
            fi
            echo "::warning::apt failed (attempt $attempt), retrying in 30 s"
            sleep 30
          done
          exit 1

      - run: npm ci
      - run: npm test

      - name: Build AppImage, rpm, deb, pacman, tar.gz
        run: npm run dist

      - name: Import Flatpak signing key (optional)
        id: gpg
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "No FLATPAK_GPG_PRIVATE_KEY secret: the Flatpak repository will be unsigned."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 -p "$GNUPGHOME"
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          gpg --export "$KEY" > "$RUNNER_TEMP/flatpak-pubkey.gpg"
          echo "args=--gpg-sign=$KEY --gpg-homedir=$GNUPGHOME" >> "$GITHUB_OUTPUT"
          echo "pubkey=$RUNNER_TEMP/flatpak-pubkey.gpg" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak bundle + repository
        id: flatpak
        continue-on-error: true
        env:
          V: ${{ steps.ver.outputs.version }}
          GPG_ARGS: ${{ steps.gpg.outputs.args }}
          PUBKEY: ${{ steps.gpg.outputs.pubkey }}
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo/
          GH_TOKEN: ${{ github.token }}
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cd flatpak
          flatpak-builder --user --install-deps-from=flathub --force-clean $GPG_ARGS \
            --default-branch=stable --repo=repo build-dir io.github.samschultzponsys.WebRoost.yml
          flatpak build-update-repo $GPG_ARGS --title="WebRoost" --default-branch=stable --prune repo
          BUNDLE_KEYS=""; [ -n "$PUBKEY" ] && BUNDLE_KEYS="--gpg-keys=$PUBKEY"
          # --repo-url makes bundle installs track the repository, so Discover /
          # flatpak update pick up new versions.
          flatpak build-bundle $GPG_ARGS $BUNDLE_KEYS --repo-url="$REPO_URL" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "../release/webroost-$V-x86_64.flatpak" io.github.samschultzponsys.WebRoost stable

          # GitHub Pages site: the OSTree repository + .flatpakrepo/.flatpakref files.
          SITE=../site; mkdir -p $SITE
          cp -a repo $SITE/repo
          rm -rf $SITE/repo/tmp $SITE/repo/.lock
          cp ../assets/icons/128x128.png $SITE/icon.png
          GPGLINE=""; [ -n "$PUBKEY" ] && GPGLINE="GPGKey=$(base64 -w0 "$PUBKEY")"
          printf '[Flatpak Repo]\nTitle=WebRoost\nUrl=%s\nHomepage=https://github.com/%s\nComment=Web apps that live in your tray\nIcon=%sicon.png\nDefaultBranch=stable\n%s\n' \
            "$REPO_URL" "${{ github.repository }}" "${REPO_URL%repo/}" "$GPGLINE" > $SITE/webroost.flatpakrepo
          printf '[Flatpak Ref]\nTitle=WebRoost\nName=io.github.samschultzponsys.WebRoost\nBranch=stable\nUrl=%s\nSuggestRemoteName=webroost\nHomepage=https://github.com/%s\nIcon=%sicon.png\nRuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo\nIsRuntime=false\n%s\n' \
            "$REPO_URL" "${{ github.repository }}" "${REPO_URL%repo/}" "$GPGLINE" > $SITE/webroost.flatpakref
          sed "s|@VERSION@|$V|g" site-index.html > $SITE/index.html
          touch $SITE/.nojekyll
          # Only publish when GitHub Pages is switched on (Settings -> Pages ->
          # Source: GitHub Actions); otherwise the deploy fails on every release.
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled; skipping the Flatpak repository site."
          fi

      - name: Checksums
        run: |
          cd release
          sha256sum webroost-${{ steps.ver.outputs.version }}-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Flatpak repository for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false' && steps.flatpak.outputs.site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: webroost-${{ steps.ver.outputs.version }}
          path: |
            release/webroost-*
            release/SHA256SUMS.txt
          if-no-files-found: error
          # The release job publishes these within minutes; the GitHub release
          # is the permanent copy. Short retention keeps Actions storage small.
          retention-days: 2

    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false' }}
      publish_pages: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false' && steps.flatpak.outputs.site == 'true' }}

  # Tags the commit and publishes one GitHub release with every package.
  release:
    needs: build
    if: always() && (needs.build.outputs.release == 'true' || inputs.from_run != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ inputs.from_run != '' && inputs.version || needs.build.outputs.version }}
      SHA: ${{ inputs.from_run != '' && inputs.sha || github.sha }}
      RUN: ${{ inputs.from_run != '' && inputs.from_run || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GitHub refuses to let the Actions token create a tag on a commit
          # whose workflow files differ from main's. An optional RELEASE_TOKEN
          # secret (fine-grained PAT: Contents + Workflows, read/write) avoids that.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: webroost-${{ env.V }}
          path: dist
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: Check packages
        run: |
          ls -la dist
          # Every release carries every distro's package.
          for f in x86_64.rpm amd64.deb x64.pacman x86_64.AppImage x64.tar.gz x86_64.flatpak; do
            test -f "dist/webroost-$V-$f" || { echo "::error::webroost-$V-$f is missing; not publishing an incomplete release"; exit 1; }
          done
          test -f dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          git show "$SHA:CHANGELOG.md" > changelog-at-sha.md
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' changelog-at-sha.md > release-notes.md
          {
            echo
            echo "### Downloads"
            echo "| Distro | File |"
            echo "|---|---|"
            echo "| Fedora / RHEL / openSUSE | \`webroost-$V-x86_64.rpm\` |"
            echo "| Debian / Ubuntu / Mint | \`webroost-$V-amd64.deb\` |"
            echo "| Arch / Manjaro | \`webroost-$V-x64.pacman\` |"
            echo "| Any distro (portable) | \`webroost-$V-x86_64.AppImage\` |"
            echo "| Any distro (sandboxed) | \`webroost-$V-x86_64.flatpak\`, or with auto-updates: \`flatpak install --user https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/webroost.flatpakref\` |"
            echo "| Manual install | \`webroost-$V-x64.tar.gz\` |"
          } >> release-notes.md
          cat release-notes.md

      - name: Tag v${{ env.V }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V already exists: $(git ls-remote --tags origin "refs/tags/v$V")"
          else
            git tag "v$V" "$SHA"
            if ! git push origin "refs/tags/v$V"; then
              echo "::error::Could not create tag v$V. The commit's workflow file differs from main's, and the Actions token may not create that tag."
              echo "::error::Fix: push the tag yourself (git tag v$V $SHA && git push origin v$V) and re-run, or add a RELEASE_TOKEN secret."
              exit 1
            fi
          fi

      - name: Publish release
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V exists; uploading any missing files."
            gh release upload "v$V" dist/* --clobber
          else
            gh release create "v$V" dist/* --verify-tag --title "WebRoost $V" --notes-file release-notes.md
          fi
          gh release view "v$V"

      # Until a stable base is declared, only the newest release is kept.
      # Tags stay, so older versions can still be rebuilt. Set to "false"
      # (or raise KEEP) to keep release history.
      - name: Prune older releases
        if: env.PRUNE_OLD_RELEASES == 'true'
        env:
          PRUNE_OLD_RELEASES: 'true'
          KEEP: '1'
          KEEP_RUNS: '10'
        run: scripts/prune-releases.sh || echo "::warning::Pruning old releases failed"

  # Publishes the Flatpak repository to https://<owner>.github.io/webroost/.
  # One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
  pages:
    needs: [build, release]
    if: needs.build.outputs.publish_pages == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # The packages are on the GitHub release now; the run's copies (~750 MB)
  # would otherwise count against the account's Actions storage (500 MB on the
  # free plan). Kept only when the release failed, so it can be republished.
  cleanup:
    needs: [build, release, pages]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete this run's artifacts
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "Deleted artifact $id"
          done
