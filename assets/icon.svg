<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="0.55" stop-color="#b34dff"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ecff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a0a5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="232" rx="112" fill="#ffffff" opacity="0.08"/>

  <!-- tray bar -->
  <rect x="84" y="384" width="344" height="56" rx="28" fill="#2a0f5c" opacity="0.35"/>
  <circle cx="356" cy="412" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="312" cy="412" r="10" fill="#ffffff" opacity="0.45"/>
  <circle cx="276" cy="412" r="10" fill="#ffffff" opacity="0.45"/>

  <!-- pop lines -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="356" y1="372" x2="356" y2="352"/>
    <line x1="392" y1="380" x2="404" y2="364"/>
    <line x1="320" y1="380" x2="308" y2="364"/>
  </g>

  <!-- the app window popping out of the tray -->
  <g filter="url(#shadow)">
    <rect x="104" y="92" width="304" height="236" rx="34" fill="url(#win)"/>
    <path d="M104 126 a34 34 0 0 1 34 -34 h236 a34 34 0 0 1 34 34 v22 h-304 z" fill="#2a0f5c" opacity="0.9"/>
    <circle cx="140" cy="122" r="9" fill="#ff5fa2"/>
    <circle cx="168" cy="122" r="9" fill="#ffc94d"/>
    <circle cx="196" cy="122" r="9" fill="#4de1a2"/>
    <!-- content: a lightning "pop" glyph -->
    <path d="M270 168 L214 252 h40 l-14 58 l62 -92 h-42 z" fill="url(#bg)"/>
  </g>
</svg>
