<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- WebRoost: a birdhouse, home for your web apps, with its resident peeking out. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b0630" flood-opacity="0.32"/></filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="232" rx="112" fill="#ffffff" opacity="0.06"/>
  <g filter="url(#shadow)">
    <!-- house -->
    <path d="M140 214 L256 122 L372 214 V394 a20 20 0 0 1 -20 20 H160 a20 20 0 0 1 -20 -20 Z" fill="url(#wall)"/>
    <!-- roof -->
    <path d="M100 236 L256 108 L412 236" fill="none" stroke="url(#roof)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- door -->
    <circle cx="256" cy="282" r="66" fill="#1e1b4b"/>
    <!-- the resident -->
    <circle cx="262" cy="300" r="42" fill="#ffffff"/>
    <path d="M300 288 L334 300 L300 312 Z" fill="#fbbf24"/>
    <circle cx="276" cy="290" r="8" fill="#1e1b4b"/>
    <!-- perch -->
    <rect x="226" y="366" width="60" height="16" rx="8" fill="#1e1b4b" opacity="0.85"/>
  </g>
</svg>
